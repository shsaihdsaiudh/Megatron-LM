# ---基本信息---
# [必填项] 自定义任务名称，支持 1~120 位字符，只包含大小写字母、数字、中划线（-）、下划线（_），且不以中划线或下划线开头/结尾
jobName: "custom-train-job-name"
# 描述，0~500 位字符
description: ""
# 可见范围
# 支持 PUBLIC(空间可见), QUEUE(本队列成员可见), PRIVATE(仅创建人可见)，默认值为 PUBLIC
accessType: "PUBLIC"
# 标签
#tags: ["tagName1","tagName2"]

# ---环境信息---
# ---镜像配置
imageConfig:
  imageUrl: "replace with your imageUrl" # [必填项] 镜像 URL 地址，必须以<redacted-image>
  imageCommand: "echo 'hello world' && sleep 900" # [必填项] 入口命令；当前平台执行依赖镜像内置 bash，请确认镜像 PATH 中可找到 bash（例如包含 /bin/bash 或 /usr/bin/bash），Alpine / distroless 默认通常不包含 bash
  #imageToken: "replace with your imageToken"     # 非必填，私有镜像仓库认证 Token
  #imageSecret: "replace with your imageSecret" # 非必填，私有镜像仓库认证密钥名称

# ---模型仓库配置
# 选择的模型将被自动挂载到容器内 /preset-models 路径下
#modelUri: "public/Qwen3-0.6B"
# ---存储配置
# 同一个卷不允许多次挂载
# 多个挂载卷时，挂载路径不能重复；挂载路径必须为绝对路径，且不能为 / 或 /ml-engine/code
# 卷子目录必须为绝对路径
# ---JuiceFS存储
# 可以访问 https://<redacted-image> 获取 JuiceFS 存储卷信息
#juiceFsMountConfigs:
#    - volume: <redacted>
#      subPath: "replace with your subPath" # 非必填，JuiceFS卷子目录
#      juiceFsCluster: <redacted>
#      mountPath: "replace with your mountPath" # 必填，挂载路径
#      readOnly: false # 非必填，是否只读
# ---NAS存储
# 目前仅支持天津自驾集群
#nasMountConfigs:
#    - fileSystem: "replace with your NAS fileSystem" # 必填，NAS文件系统名称
#      volume: <redacted>
#      mountPath: "replace with your mountPath" # 必填，挂载路径
#      readOnly: false # 非必填，是否只读，默认false
# ---CPFS存储
# 目前仅支持张家口阿里云集群
#cpfsMountConfigs:
#    - volume: <redacted>
#      cpfsCluster: "replace with your CPFS cluster" # 必填，CPFS集群名称
#      mountPath: "replace with your mountPath" # 必填，挂载路径
#      readOnly: false # 非必填，是否只读，默认false
# ---代码配置
# 对于 GitLab Url 需以 https:// 开头，.git 结尾
#codeConfig:
#    codeUrl: "replace with your codeUrl"       # 必填，Git 地址
#    codeBranch: "replace with your codeBranch" # 必填，Git 分支名
#    codeCommit: "replace with your codeCommit" # 非必填，Git commitId，缺失时默认填充最新 commitId
#    codeToken: "replace with your codeToken"   # 非必填，私有仓库访问 Token
# ---环境变量
#envConfigs:
#    - key: "key1"
#      value: "value1"

# ---资源信息---
# ---队列配置
# 可通过 cml queue list 指令查看您所在队列信息列表
queueId: "<redacted>"
# ---任务优先级配置
# 数字越大优先级越高，队列内按优先级分组，组内 FIFO
# 仅支持配置部分档位：2、5、8，默认优先级为 5
priority: 5
# ---是否使用闲时资源
#preemptible: true
# ---训练框架
# 支持 [pytorch, ray, tensorflow, mpi]，默认值为 pytorch
framework: "pytorch"
# ---资源配置
# 可通过 cml queue list 指令查看您所在队列拥有的资源信息列表
# pytorch 框架 nodeRole 支持 [worker]
# ray 框架 nodeRole 支持 [head,worker]：head 必选且只能 1 个（实例数必须为 1）；worker 名需包含 worker、仅小写字母/数字/中划线、不超过 8 位，可配 worker、worker1、worker2 ...，数量 1~10 个
# tensorflow 框架 nodeRole 支持 [ps,worker]
# mpi 框架 nodeRole 支持 [worker]
resourceConfigs:
  - nodeRole: "worker" # 节点角色
    nodeNumber: 1 # 节点数量，非弹性角色必须 >= 1（head 恒为 1）；弹性角色该值不生效
    #elastic: true          # 非必填，是否弹性扩缩，仅 ray 框架且仅 worker 支持；开启后必须至少保留一个固定节点数的 worker（nodeNumber >= 1）
    #minNum: 0              # 非必填，弹性最小节点数，后端强制必须为 0
    #maxNum: 4              # 非必填，弹性最大节点数，必须大于 minNum；全部角色按 elastic ? maxNum : nodeNumber 求和，总量不超过 200（实时模式 1000）
    #preemptible: false     # 非必填，弹性 worker 必须为 true 或 resourcePriority 为 BEST_EFFORT_PUBLIC；固定 worker 不可为 true
    perNodeResourceSpec:
      resourcePriority: "GUARANTEED" # 资源优先级
      resourceName: <redacted>
      resourceNumber: 1 # [必填项] 单节点资源数量，GPU 资源只能是 1,2,4,8; vGPU 资源只能是0.25,0.5; CPU 资源不可小于 4
# ---运行参数配置
# 支持设置 Ray driver 的 runtimeEnv
#runtimeEnv: |-
#    {
#        "pip": [
#            "emoji"
#        ]
#    }

# ---其他信息---
# ---开启tensorboard
# 开启后，平台将自动注入 $TENSORBOARD_LOG_PATH 环境变量，代表 TensorBoard 日志保存目录，在训练容器内可访问该路径
#enableTensorboard: true
# ---开启训练可观测
#enableMetrics: true
# ---任务诊断策略
# 仅 GPU 规格任务且 pytorch 框架支持任务诊断
diagOptions:
  - name: "HangDetection"         # 是否开启 Hang 检测，默认关闭
    enable: false
  - name: "SanityCheck"
    enable: true              # true 开启, false 关闭
    config:
      preSanityCheck: true   # 训练前检查
      postSanityCheck: true  # 训练后检查
# ---自动重试
# 自动重试的触发条件支持 JobFailed（任务失败）、NodeFailure（节点故障）、JobPreempted（任务被抢占）、JobHang（任务 Hang）、BestNetworkTopology（最优网络拓扑）
# NodeFailure 仅单节点资源数量为 8 卡 & pytorch 框架的任务可开启
# JobPreempted 仅 BEST_EFFORT 弹性资源 & pytorch 框架的任务可开启
retryConfig:
  enableRetry: false      # 是否开启自动重试, 默认关闭
  maxRetryTimes: 5        # 最大重试次数, 取值范围 [1, 100], 默认值为 5
  policySets:             # 自动重试的触发条件
    - "JobFailed"
  #enablePodFailRetry: false  # 非必填，是否开启 Pod 故障自愈重试（仅 pytorch 框架支持，仅 core 空间开放）
# ---是否使用RDMA
# 仅节点数量>=2 且单节点资源数量为 8 时才允许开启，如需开启，则可以反注释下方配置
#rdma: true
# ---告警配置
# P0 告警级别不支持配置飞书群
#alertConfig:
#    enableAlert: true           # 是否开启告警
#    alertItems:                 # 告警项
#        - alertConditions:          # 必填, 告警触发条件, 支持 START_RUNNING(开始运行), SUCCEED(完成), FAILED(失败), HANG(Hang检测), RETRY(自动重试)
#            - START_RUNNING
#            - SUCCEED
#            - FAILED
#          alertConditionParams:         # 非必填, 告警触发条件额外参数
#            retryAlertType: "last_time"     # 自动重试告警触发类型，支持 last_time(最后一次重试)、every_time(每次重试)、custom_define(自定义)
#            ignoreAlertRetryTimes: 0        # 自定义自动重试类型时必填，表示前x次重试不告警，后面每次重试均告警
#          alertLevel: P2            # 必填, 告警级别, 支持 P0(飞书+电话), P1(飞书), P2(飞书)
#          alertReceivers:           # 必填, 告警接收人, 至少 1 种通知对象
#            persons:                    # 个人, 限制 10 人
#                - "emailPrefix"
#            feishuGroups:               # 飞书群, 限制 10 个
#                - chatId: "xxx"
#            falconGroups:                # Falcon 报警组, 限制 10 个
#                - oncallName: "xxx"

# ---KeyCenter sidecar 配置---
# 配置后平台会为任务注入 KeyCenter sidecar 容器
#kcConfig:
#    sid: "xxx"                    # 必填（只要配置了 kcConfig），KeyCenter 服务标识，例如：aie
#    appId: "xxx"                  # 非必填，不传时由后端按 sid 反查回填，例如：ns-676/aie-kc
#    resource:                     # 非必填，sidecar 占用的资源
#        cpuLimit: 0.5             # 非必填，CPU 限额，单位：核
#        memoryLimit: "0.5GiB"     # 非必填，内存限额，以 GiB 结尾
